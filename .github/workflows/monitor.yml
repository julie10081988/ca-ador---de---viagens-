
name: Cacador de Viagens

on:
  workflow_dispatch:
    inputs:
      teste_telegram:
        description: 'Enviar mensagem de teste ao Telegram?'
        type: boolean
        default: false
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar passagens e enviar alertas
         TESTE_TELEGRAM: ${{ inputs.teste_telegram && '1' || '0' }}
        run: python monitor.py

      - name: Salvar ofertas e historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.json seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar ofertas de passagens"
            git push
          fi
